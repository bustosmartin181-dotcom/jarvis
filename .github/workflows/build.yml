name: Compilar APK de JARVIS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Descargar el modelo de voz en español (Vosk)
        run: |
          curl -L -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-es
          mv vosk-model-small-es-0.42 app/src/main/assets/model-es
          rm -f app/src/main/assets/model-es/README
          echo "vosk-small-es-0.42" > app/src/main/assets/model-es/uuid

      - name: Compilar la APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - name: Publicar la APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: JARVIS v${{ github.run_number }}
          body: "Tocá **Jarvis.apk** para descargar e instalar."
          files: Jarvis.apk
          make_latest: true
