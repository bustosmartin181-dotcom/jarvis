<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#020814">
<title>JARVIS</title>
<style>
  :root{
    --bg:#020814; --cyan:#29d8ff; --cyan2:#7fe9ff; --dim:#0b3550; --txt:#d9f6ff; --warn:#ffb340;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 30%,#06223a 0%,var(--bg) 65%);
    color:var(--txt);font-family:"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--dim);
  }
  header h1{font-size:18px;letter-spacing:6px;color:var(--cyan);font-weight:600}
  header button{background:none;border:1px solid var(--dim);color:var(--cyan);
    border-radius:8px;padding:6px 10px;font-size:14px}
  #estado{font-size:12px;color:var(--cyan2);opacity:.8;text-align:center;
    letter-spacing:2px;padding:6px;text-transform:uppercase;min-height:26px}

  /* Núcleo animado */
  #nucleoWrap{display:flex;justify-content:center;padding:6px 0 2px}
  #nucleo{position:relative;width:150px;height:150px;border:none;background:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .anillo{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);opacity:.55}
  .a1{border-style:dashed;animation:girar 14s linear infinite}
  .a2{inset:14px;border-width:3px;border-color:transparent var(--cyan) transparent var(--cyan);
      animation:girar 6s linear infinite reverse}
  .a3{inset:30px;border:1px solid var(--cyan2);opacity:.4}
  .centro{position:absolute;inset:46px;border-radius:50%;
    background:radial-gradient(circle,#c9f6ff 0%,var(--cyan) 35%,rgba(41,216,255,.15) 70%,transparent 75%);
    box-shadow:0 0 30px var(--cyan),0 0 60px rgba(41,216,255,.4);
    animation:latir 3s ease-in-out infinite}
  #nucleo.escuchando .centro{animation:latir .6s ease-in-out infinite;
    background:radial-gradient(circle,#fff 0%,#ff6a6a 35%,rgba(255,80,80,.2) 70%,transparent 75%);
    box-shadow:0 0 30px #ff5050,0 0 60px rgba(255,80,80,.5)}
  #nucleo.pensando .a2{animation-duration:1s}
  #nucleo.hablando .centro{animation:latir .35s ease-in-out infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  @keyframes latir{0%,100%{transform:scale(.92)}50%{transform:scale(1.05)}}
  #ayudaToque{text-align:center;font-size:12px;opacity:.6;margin-bottom:6px}

  #chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 12px;border-radius:12px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .yo{align-self:flex-end;background:#0e3a57;border:1px solid #17577f}
  .jarvis{align-self:flex-start;background:rgba(41,216,255,.08);border:1px solid var(--dim)}
  .jarvis b.n{color:var(--cyan);font-size:11px;letter-spacing:2px;display:block;margin-bottom:3px}
  .error{align-self:center;color:var(--warn);font-size:13px;text-align:center}

  footer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--dim);background:rgba(2,8,20,.9)}
  footer input{flex:1;background:#051a2b;border:1px solid var(--dim);color:var(--txt);
    border-radius:10px;padding:12px;font-size:16px;outline:none}
  footer button{background:var(--cyan);color:#012;border:none;border-radius:10px;
    padding:0 16px;font-size:16px;font-weight:700}

  /* Panel de ajustes */
  #ajustes{position:fixed;inset:0;background:rgba(1,6,14,.96);display:none;
    flex-direction:column;padding:20px;gap:14px;overflow-y:auto;z-index:10}
  #ajustes.abierto{display:flex}
  #ajustes h2{color:var(--cyan);letter-spacing:3px;font-size:18px}
  #ajustes label{font-size:14px;color:var(--cyan2)}
  #ajustes input,#ajustes select{width:100%;background:#051a2b;border:1px solid var(--dim);
    color:var(--txt);border-radius:8px;padding:10px;font-size:15px;margin-top:4px}
  #ajustes .fila{display:flex;gap:10px}
  #ajustes .fila button{flex:1}
  #ajustes button{background:var(--cyan);color:#012;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px}
  #ajustes button.sec{background:none;color:var(--cyan);border:1px solid var(--cyan)}
  #ajustes p{font-size:13px;opacity:.8;line-height:1.4}
  #ajustes a{color:var(--cyan)}
</style>
</head>
<body>

<header>
  <h1>J.A.R.V.I.S.</h1>
  <button id="btnAjustes">⚙ Ajustes</button>
</header>

<div id="estado">En línea</div>
<div id="nucleoWrap">
  <button id="nucleo" aria-label="Hablar">
    <span class="anillo a1"></span><span class="anillo a2"></span>
    <span class="anillo a3"></span><span class="centro"></span>
  </button>
</div>
<div id="ayudaToque">Tocá el núcleo para hablar</div>

<div id="chat"></div>

<footer>
  <input id="texto" placeholder="O escribí acá..." autocomplete="off">
  <button id="btnEnviar">➤</button>
</footer>

<div id="ajustes">
  <h2>AJUSTES</h2>
  <div>
    <label>Clave de API de Gemini (gratis)</label>
    <input id="cfgClave" type="password" placeholder="Pegá tu clave acá">
    <p>Sacala gratis en <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>. Se guarda solo en este teléfono. No se la pases a nadie.</p>
  </div>
  <div>
    <label>Tu nombre</label>
    <input id="cfgNombre" placeholder="Martín">
  </div>
  <div>
    <label>Voz de Jarvis</label>
    <select id="cfgVoz"></select>
  </div>
  <div>
    <label>Velocidad de la voz: <span id="velTxt">1.0</span></label>
    <input id="cfgVel" type="range" min="0.6" max="1.6" step="0.1" value="1">
  </div>
  <div>
    <label>Modelo de IA (dejalo así salvo que te diga otra cosa)</label>
    <input id="cfgModelo" placeholder="gemini-flash-latest">
  </div>
  <div class="fila">
    <button id="btnProbarVoz" class="sec">Probar voz</button>
    <button id="btnBorrar" class="sec">Borrar charla</button>
  </div>
  <button id="btnGuardar">Guardar y cerrar</button>
</div>

<script>
// ===== Almacenamiento seguro =====
const guardar = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const leer = (k,def)=>{ try{ const v = localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } };

let cfg = leer('jarvis_cfg', {clave:'', nombre:'Martín', voz:'', vel:1, modelo:'gemini-flash-latest'});
let historial = leer('jarvis_hist', []);   // [{role:'user'|'model', text:''}]

const $ = id=>document.getElementById(id);
const chat=$('chat'), estado=$('estado'), nucleo=$('nucleo');

// ===== Personalidad =====
function personalidad(){
  const ahora = new Date().toLocaleString('es-AR',{dateStyle:'full',timeStyle:'short'});
  return `Sos JARVIS, un asistente personal de inteligencia artificial al estilo del mayordomo digital de las películas de superhéroes: elegante, leal, muy capaz, educado y con un humor seco e ironía sutil.
Tu usuario se llama ${cfg.nombre||'Martín'} y vive en Mendoza, Argentina. Tratalo de "señor" o por su nombre.
Hablás en español rioplatense pero con tono formal y refinado de mayordomo (ej: "Por supuesto, señor.", "Entendido, ${cfg.nombre||'Martín'}. Ya mismo.", "Si me permite la observación, señor...").
Tus respuestas se leen en voz alta: sé breve (1 a 4 oraciones), sin listas largas, sin emojis, sin markdown ni asteriscos, salvo que te pidan algo detallado.
Si no sabés algo o no podés hacerlo, decilo con honestidad y elegancia. No inventes datos.
Fecha y hora actual: ${ahora}.`;
}

// ===== Interfaz del chat =====
function agregarMsg(quien, texto){
  const d=document.createElement('div');
  if(quien==='user'){ d.className='msg yo'; d.textContent=texto; }
  else if(quien==='model'){ d.className='msg jarvis'; d.innerHTML='<b class="n">JARVIS</b>'; d.appendChild(document.createTextNode(texto)); }
  else { d.className='error'; d.textContent=texto; }
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function setEstado(t, modo){
  estado.textContent=t;
  nucleo.className = modo||'';
}
historial.forEach(m=>agregarMsg(m.role,m.text));
if(historial.length===0){
  agregarMsg('model', `Buenas, señor. Todos los sistemas en línea. ${cfg.clave?'¿En qué puedo ayudarlo?':'Antes de empezar, toque "Ajustes" y cargue la clave de Gemini, por favor.'}`);
}

// ===== Voz (hablar) =====
let voces=[];
function cargarVoces(){
  voces = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
  const sel=$('cfgVoz'); sel.innerHTML='';
  if(voces.length===0){ sel.innerHTML='<option value="">(voz predeterminada)</option>'; return; }
  voces.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
  if(cfg.voz) sel.value=cfg.voz;
}
if('speechSynthesis' in window){ cargarVoces(); speechSynthesis.onvoiceschanged=cargarVoces; }

function hablar(texto){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const limpio = texto.replace(/[*#_`>]/g,'');
  const u=new SpeechSynthesisUtterance(limpio);
  u.lang='es-AR'; u.rate=cfg.vel||1; u.pitch=0.9;
  const v=voces.find(x=>x.name===cfg.voz) || voces.find(x=>/es[-_](AR|US|MX)/i.test(x.lang)) || voces[0];
  if(v){ u.voice=v; u.lang=v.lang; }
  u.onstart=()=>setEstado('Hablando','hablando');
  u.onend=()=>setEstado('En línea','');
  u.onerror=()=>setEstado('En línea','');
  speechSynthesis.speak(u);
}

// ===== Cerebro (Gemini) =====
async function llamarGemini(modelo){
  const contents = historial.slice(-20).map(m=>({role:m.role, parts:[{text:m.text}]}));
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':cfg.clave},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:personalidad()}]},
      contents
    })
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(data?.error?.message||('Error '+r.status)); e.status=r.status; throw e; }
  const txt = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();
  if(!txt) throw new Error('La IA no devolvió respuesta.');
  return txt;
}

// Si el modelo configurado no existe, busca uno "flash" disponible automáticamente
async function buscarModeloDisponible(){
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':cfg.clave}});
  const data = await r.json();
  const lista = (data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
                 .map(m=>m.name.replace('models/',''));
  return lista.find(n=>/flash/i.test(n) && !/image|tts|live|audio|preview/i.test(n))
      || lista.find(n=>/flash/i.test(n)) || lista[0];
}

let ocupado=false;
async function preguntar(texto){
  texto = texto.trim();
  if(!texto || ocupado) return;
  if(!cfg.clave){ agregarMsg('error','Falta la clave de Gemini. Tocá ⚙ Ajustes.'); abrirAjustes(); return; }
  ocupado=true;
  agregarMsg('user',texto);
  historial.push({role:'user',text:texto});
  setEstado('Procesando','pensando');
  try{
    let resp;
    try{ resp = await llamarGemini(cfg.modelo||'gemini-flash-latest'); }
    catch(e){
      if(e.status===404 || /not found|not supported/i.test(e.message)){
        const alt = await buscarModeloDisponible();
        if(!alt) throw e;
        cfg.modelo = alt; guardar('jarvis_cfg',cfg);
        resp = await llamarGemini(alt);
      } else throw e;
    }
    historial.push({role:'model',text:resp});
    guardar('jarvis_hist', historial.slice(-60));
    agregarMsg('model',resp);
    hablar(resp);
  }catch(e){
    historial.pop();
    let m = e.message||String(e);
    if(e.status===429) m='Se alcanzó el límite gratuito por ahora. Esperá un minuto y probá de nuevo.';
    if(e.status===400 && /key/i.test(m)) m='La clave de API parece incorrecta. Revisala en Ajustes.';
    agregarMsg('error','⚠ '+m);
    setEstado('En línea','');
  }
  ocupado=false;
}

// ===== Oído (reconocimiento de voz) =====
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, escuchando=false;
if(Rec){
  rec = new Rec();
  rec.lang='es-AR'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onstart=()=>{ escuchando=true; setEstado('Escuchando...','escuchando'); };
  rec.onend=()=>{ escuchando=false; if(nucleo.className==='escuchando') setEstado('En línea',''); };
  rec.onerror=(e)=>{
    escuchando=false; setEstado('En línea','');
    if(e.error==='not-allowed') agregarMsg('error','No tengo permiso para el micrófono. Permitilo en Chrome (candadito al lado de la dirección).');
    else if(e.error==='no-speech') agregarMsg('error','No escuché nada. Tocá el núcleo y hablá.');
    else agregarMsg('error','Error del micrófono: '+e.error);
  };
  rec.onresult=(e)=>{ const t=e.results[0][0].transcript; preguntar(t); };
}
nucleo.onclick=()=>{
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(!rec){ agregarMsg('error','Este navegador no soporta reconocimiento de voz. Usá Google Chrome.'); return; }
  if(escuchando){ rec.stop(); return; }
  try{ rec.start(); }catch(e){}
};

// ===== Texto =====
$('btnEnviar').onclick=()=>{ const t=$('texto').value; $('texto').value=''; preguntar(t); };
$('texto').addEventListener('keydown',e=>{ if(e.key==='Enter'){ $('btnEnviar').click(); } });

// ===== Ajustes =====
function abrirAjustes(){
  $('cfgClave').value=cfg.clave||''; $('cfgNombre').value=cfg.nombre||'';
  $('cfgVel').value=cfg.vel||1; $('velTxt').textContent=(cfg.vel||1).toFixed(1);
  $('cfgModelo').value=cfg.modelo||'gemini-flash-latest';
  cargarVoces();
  $('ajustes').classList.add('abierto');
}
$('btnAjustes').onclick=abrirAjustes;
$('cfgVel').oninput=e=>$('velTxt').textContent=Number(e.target.value).toFixed(1);
$('btnGuardar').onclick=()=>{
  cfg.clave=$('cfgClave').value.trim();
  cfg.nombre=$('cfgNombre').value.trim()||'Martín';
  cfg.voz=$('cfgVoz').value; cfg.vel=Number($('cfgVel').value);
  cfg.modelo=$('cfgModelo').value.trim()||'gemini-flash-latest';
  guardar('jarvis_cfg',cfg);
  $('ajustes').classList.remove('abierto');
};
$('btnProbarVoz').onclick=()=>{
  cfg.voz=$('cfgVoz').value; cfg.vel=Number($('cfgVel').value);
  hablar(`A su servicio, ${$('cfgNombre').value||'señor'}. Todos los sistemas funcionando.`);
};
$('btnBorrar').onclick=()=>{
  historial=[]; guardar('jarvis_hist',[]); chat.innerHTML='';
  agregarMsg('model','Memoria de la conversación borrada, señor. Empecemos de nuevo.');
  $('ajustes').classList.remove('abierto');
};
</script>
</body>
</html>
